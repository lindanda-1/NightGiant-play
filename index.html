let ruinSeed=27691;
function ruinRandom() {

function lineOnStone(x1,z1,x2,z2,y,width,material) {
  const dx=x2-x1, dz=z2-z1;
  const segment=slab(width,.012,Math.hypot(dx,dz),material,(x1+x2)/2,y,(z1+z2)/2);

function floorTiles() {
  const tiles = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1.93,.105,1.93), mat(0xffffff,.08), 130
  );
  const sample = new THREE.Object3D();
  const tint = new THREE.Color();
  let index=0;
  for(let i=0;i<10;i++)for(let j=0;j<13;j++){
    const x=-9+i*2, z=-15+j*2;
    sample.position.set(x,-.048,z);
    sample.rotation.y=(ruinRandom()-.5)*.028;
    sample.updateMatrix();
    tiles.setMatrixAt(index,sample.matrix);
    const tintHex = Math.abs(x)<2 ? 0x303b4b : 0x232a37;
    tiles.setColorAt(index++,tint.setHex(tintHex).multiplyScalar(.71+ruinRandom()*.46));
  }

  ruins.add(tiles);
}

  const strip=slab(.085,height*.57,.022,runeInk,x,.55+height*.34,z+.37);

}

function moonAndEmbers() {

  for(let i=0;i<14;i++){

    const peak=new THREE.Mesh(new THREE.ConeGeometry(3+ruinRandom()*4,h,4),mountains);
    peak.position.set(-41+i*6.3,h/2-3,-28-ruinRandom()*19);
    peak.rotation.y=ruinRandom()*2;
    sky.add(peak);

  const positions = new Float32Array(210*3);
  const colors = new Float32Array(210*3);
  const star = new THREE.Color();
  for(let i=0;i<210;i++){
    const j=i*3;
    const ember=i<42;
    positions[j] = ember ? (i%2 ? -1 : 1)*(9.75+ruinRandom()*.85) : (ruinRandom()-.5)*106;
    positions[j+1] = ember ? ruinRandom()*3.05 : 8+ruinRandom()*40;

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));

  }));

}

// Merge decorative geometry by material to keep draw calls low on mobile.
function mergeByMaterial(group, receiveShadow, castShadow) {
  const byMaterial = new Map();
  for(const object of group.children) {
    if(!object.isMesh || object.isInstancedMesh) continue;
    const material = object.material;
    if(!byMaterial.has(material)) byMaterial.set(material, []);
    byMaterial.get(material).push(object);
  }
  for(const [material, objects] of byMaterial) {
    if(objects.length < 2) continue;
    const pieces = objects.map(object => {
      object.updateMatrix();
      const geometry = object.geometry.index ? object.geometry.toNonIndexed() : object.geometry.clone();
      return geometry.applyMatrix4(object.matrix);
    });
    const merged = window.NightGiantGeometry.mergeGeometries(pieces);
    for(const geometry of pieces) geometry.dispose();
    if(!merged) continue;
    for(const object of objects) {
      object.geometry.dispose();
      group.remove(object);
    }
    const batch = new THREE.Mesh(merged, material);
    batch.receiveShadow = receiveShadow;
    batch.castShadow = castShadow;
    group.add(batch);
  }
}

function playMotion(name, once = false) {
  const next = actions[name];
  if (!next || (!once && (oneShot || activeAction === next))) return;
  const previous = activeAction;
  if (previous && previous !== next) previous.fadeOut(0.13);
  next.reset().setEffectiveWeight(1);
  next.setLoop(once ? THREE.LoopOnce : name === 'Push' ? THREE.LoopPingPong : THREE.LoopRepeat, once ? 1 : Infinity);
  next.setEffectiveTimeScale(name === 'Push' ? .72 : 1);
  next.clampWhenFinished = once;
  next.fadeIn(0.13).play();
  activeAction = next;
  oneShot = once ? next : null;
}

function loadHero() {
  const bytes = Uint8Array.from(atob(window.nightGiantModel), char => char.charCodeAt(0));
  delete window.nightGiantModel;
  const loader = new window.NightGiantLoader.GLTFLoader();
  loader.parse(bytes.buffer, '', ({ scene: model, animations }) => {
    model.rotation.y = Math.PI;
    model.scale.setScalar(1.13);
    model.position.y = 0.015;
    model.traverse(object => {
      if (!object.isSkinnedMesh) return;
      object.frustumCulled = false;
      object.castShadow = true;
      object.receiveShadow = false;
      const material = object.material;
      material.vertexColors = Boolean(object.geometry.getAttribute('color'));
      material.color.set(0xffffff);
      material.emissive.set(0x000000);
      material.roughness = 0.92;
      material.toneMapped = false;
      material.onBeforeCompile = shader => {
        shader.vertexShader='varying vec3 restStone;\n'+shader.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n restStone=position;');
        shader.fragmentShader='varying vec3 restStone;\n'+shader.fragmentShader;
        // Keep the reference-derived paint as the dominant color in every scene.
        const patch = `#include <opaque_fragment>`;
        shader.fragmentShader = shader.fragmentShader.replace(patch, `
          vec3 paint = max(diffuseColor.rgb, vec3(0.0));
          float blue = smoothstep(0.075, 0.27, paint.b - paint.r) *
                       smoothstep(0.12, 0.33, paint.b) *
                       smoothstep(0.025, 0.16, paint.g - paint.r);
          float red = smoothstep(0.19, 0.54, paint.r - max(paint.g, paint.b));
          float ivory = smoothstep(0.03, 0.23, paint.r - paint.b) *
                        smoothstep(0.13, 0.40, paint.g) * (1.0 - red);
          vec3 luma = vec3(dot(paint, vec3(0.2126, 0.7152, 0.0722)));
          vec3 grade = max(mix(luma, paint, 1.20), vec3(0.002));
          grade = pow(grade, vec3(1.22)) * vec3(0.89, 0.94, 1.13);
          grade = mix(grade, paint * vec3(1.09, 0.89, 0.70), ivory * 0.74);
          float grain = sin(dot(restStone,vec3(89.,53.,113.))) * sin(dot(restStone,vec3(47.,83.,37.)));
          float vein = smoothstep(.91,.99,cos(36.*restStone.y+7.*sin(9.*restStone.x)+5.*sin(12.*restStone.z)));
          grade *= (1.+.08*grain-.12*vein);
          float falloff = 0.83 + 0.24 * max(normal.y, 0.0);
          outgoingLight = grade * falloff + outgoingLight * 0.13;
          outgoingLight = mix(outgoingLight, vec3(0.012, 0.27, 1.0), blue * 0.82);
          outgoingLight = mix(outgoingLight, vec3(1.0, 0.032, 0.006), red * 0.91);
          ${patch}
        `);
      };
    });
    hero.add(model);
    mixer = new THREE.AnimationMixer(model);
    for (const animation of animations) actions[animation.name] = mixer.clipAction(animation);
    mixer.addEventListener('finished', event => {
      if (event.action === oneShot) oneShot = null;
    });
    playMotion('Idle');
    loading.remove();
  }, error => {
    console.error(error);
    loading.textContent = '夜巨人模型载入失败。请完整解压游戏包，再打开 index.html。';
  });
}

function woodTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const boards = ['#6b421f','#8b572d','#734525','#926036','#6d4322'];
  for (let i=0;i<boards.length;i++) {
    const y=i*52;
    ctx.fillStyle=boards[i];
    ctx.fillRect(0,y,256,52);
    const grain=ctx.createLinearGradient(0,y,0,y+52);
    grain.addColorStop(0,'#ffdb9f47');
    grain.addColorStop(.38,'#ffb56709');
    grain.addColorStop(1,'#28160875');
    ctx.fillStyle=grain;
    ctx.fillRect(0,y,256,52);
    for (let n=0;n<34;n++) {
      const x=ruinRandom()*256, gy=y+4+ruinRandom()*44;
      ctx.strokeStyle=n%3===0?'#ffd49742':'#24130660';
      ctx.lineWidth=ruinRandom()<.12?1.8:.75;
      ctx.beginPath();
      ctx.moveTo(x,gy);
      ctx.quadraticCurveTo(x+30,gy-4+ruinRandom()*8,x+14+ruinRandom()*135,gy+1);
      ctx.stroke();
    }
    ctx.strokeStyle='#36210e91';
    ctx.lineWidth=1.6;
    ctx.beginPath();
    ctx.ellipse(35+i*43,y+23,13,4,-.07,0,Math.PI*2);
    ctx.ellipse(37+i*43,y+23,7,2,-.07,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle='#1e130b';
    ctx.fillRect(0,y+49,256,3);
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.anisotropy=4;
  return texture;
}

function drawBeam(index,from,to,blocked){

  group.quaternion.setFromUnitVectors(lightAxis,ray.clone().normalize());

  const pool=group.userData.pool;
  pool.position.set(group.position.x,.044,group.position.z);
  pool.rotation.y=Math.atan2(ray.x,ray.z);
  pool.scale.set(2.23,group.scale.y+1.4,1);

  if(blocked) endpoint.position.addScaledVector(ray.normalize(),-.06);

function mirrorYaw(mirror){
  return THREE.MathUtils.degToRad(mirror.degrees-45);
}
function mirrorNormal(mirror){
  const angle=mirrorYaw(mirror);
  return new THREE.Vector2(Math.sin(angle),Math.cos(angle));
}

function rayHitsScreen(origin,direction){
  let near=-Infinity, far=Infinity;
  for(const [value,delta,center,half] of [
    [origin.x,direction.x,stoneScreen.x,stoneScreen.halfX],
    [origin.y,direction.y,stoneScreen.z,stoneScreen.halfZ]
  ]){
    if(Math.abs(delta)<1e-7){
      if(Math.abs(value-center)>half) return Infinity;
      continue;
    }
    const a=(center-half-value)/delta;
    const b=(center+half-value)/delta;
    near=Math.max(near,Math.min(a,b));
    far=Math.min(far,Math.max(a,b));
    if(near>far) return Infinity;
  }
  return near>.045?near:Infinity;
}

function firstBeamHit(origin,direction,previous){
  const distances=[];
  if(direction.x>1e-5) distances.push((lightRoom.right-origin.x)/direction.x);
  if(direction.x<-1e-5) distances.push((lightRoom.left-origin.x)/direction.x);
  if(direction.y>1e-5) distances.push((lightRoom.near-origin.y)/direction.y);
  if(direction.y<-1e-5) distances.push((lightRoom.far-origin.y)/direction.y);
  const wallDistance=rayHitsScreen(origin,direction);
  let distance=Math.min(wallDistance,...distances);
  let fixture=null;
  for(const target of beamTargets){
    if(target===previous) continue;
    const delta=target.point.clone().sub(origin);
    let projection=delta.dot(direction);
    if(target.mirror){
      const normal=mirrorNormal(target.mirror);
      const incidence=direction.dot(normal);
      if(Math.abs(incidence)<.001) continue;
      projection=delta.dot(normal)/incidence;
      const hitOffset=direction.clone().multiplyScalar(projection).sub(delta);
      if(hitOffset.length()>mirrorHalfWidth) continue;
    }else{
      const offset=Math.abs(delta.x*direction.y-delta.y*direction.x);
      if(offset>target.radius) continue;
      projection-=Math.sqrt(target.radius*target.radius-offset*offset);
    }
    if(projection<=.045||projection>=distance) continue;
    fixture=target;
    distance=projection;
  }
  return {fixture,blocked:!fixture&&distance===wallDistance,end:origin.clone().addScaledVector(direction,distance)};
}

let lastLightBlocked=false;
function updateLightPath(){
  let origin=emitter;
  const direction=new THREE.Vector2(1,0);
  let previous=null;
  let received=false;
  let blockedByWall=false;
  const reached=new Set();
  for(const beam of beamPath) beam.visible=beam.userData.pool.visible=beam.userData.endpoint.visible=beam.userData.splash.visible=false;
  for(let i=0;i<beamPath.length;i++){
    const {fixture,blocked,end}=firstBeamHit(origin,direction,previous);
    drawBeam(i,origin,end,blocked);
    blockedByWall ||= blocked;
    if(!fixture||fixture.receiver){
      received=Boolean(fixture?.receiver);
      break;
    }
    const mirror=fixture.mirror;
    reached.add(mirror);
    const normal=mirrorNormal(mirror);
    direction.addScaledVector(normal,-2*direction.dot(normal));
    origin=end;
    previous=fixture;
  }
  for(const mirror of mirrors){
    const lit=reached.has(mirror);
    mirror.glassMaterial.emissiveIntensity=lit?.85:.25;
    for(const glint of mirror.glints) glint.visible=lit;
  }
  if(blockedByWall&&!lastLightBlocked) cue('impact');
  lastLightBlocked=blockedByWall;
  if(received && !lightSolved){
    lightSolved=true;
    crystal.material=warmLight;
    receiverRing.material=warmLight;
    exitThreshold.material=warmLight;
    toast('水晶已点亮，出口打开！');
    cue('crystal');
    cue('door');

  progress.textContent=lightSolved?'第 2 / 10 关 · 水晶已点亮':
    `第 2 / 10 关 · 镜① ${reached.has(mirrors[0])?'已接光':'未接光'} · 镜② ${reached.has(mirrors[1])?'已接光':'未接光'}`;

}

function moveInChamber(dx,dz){

  let z=THREE.MathUtils.clamp(pos.z+dz,lightRoom.far+.37,lightRoom.near-.05);
  if(z<-40.8 && (!lightSolved || Math.abs(x-lightExit.x)>.94)) z=-40.8;
  if(moveChamberStep(pos,x,z)) return 1;
  const sideways=moveChamberStep(pos,x,pos.z);
  const forward=moveChamberStep(pos,pos.x,z);
  return sideways||forward;
}
function moveChamberStep(pos,x,z){
  const wallDx=Math.max(0,Math.abs(x-stoneScreen.x)-stoneScreen.halfX);
  const wallDz=Math.max(0,Math.abs(z-stoneScreen.z)-stoneScreen.halfZ);
  if(Math.hypot(wallDx,wallDz)<heroRadius) return 0;
  if(opticalFixtures.some(({point,radius})=>Math.hypot(x-point.x,z-point.y)<heroRadius+radius)) return 0;
  if(Math.hypot(pos.x-x,pos.z-z)<1e-6) return 0;
  pos.set(x,0,z);
  return 1;
}

function moveInGravityRoom(dx,dz){
  const pos=hero.position;
  const x=THREE.MathUtils.clamp(pos.x+dx,-roomHalf+.75,roomHalf-.75);
  let z=THREE.MathUtils.clamp(pos.z+dz,starGateZ+.22,roomZ+roomDepth/2-.55);
  const threshold=starGateZ+1.30;
  if(z<threshold&&(!gravityOpen||gravityGate.position.y<3.8||Math.abs(x)>1.24)) z=threshold;
  if(moveGravityStep(pos,x,z)) return 1;
  const sideways=moveGravityStep(pos,x,pos.z);
  const forward=moveGravityStep(pos,pos.x,z);
  return sideways||forward;
}
function moveGravityStep(pos,x,z){
  if(Math.hypot(pos.x-x,pos.z-z)<1e-6) return 0;
  for(const pillar of chamberPillars){
    const scaleX=Math.max(0,Math.abs(x-pillar.x)-pillar.half);
    const scaleZ=Math.max(0,Math.abs(z-pillar.z)-pillar.half);
    if(Math.hypot(scaleX,scaleZ)<heroRadius) return 0;
  }
  pos.set(x,0,z);
  return 1;
}
function updateGravityRoom(dt,now=performance.now()){
  starDust.material.opacity=.73+.14*Math.sin(now*.002);
  for(const [i,fragment] of fragments.entries()){
    if(fragment.found) continue;
    fragment.crystal.position.y=.61+Math.sin(now*.0025+i)*.15;
    fragment.crystal.rotation.y+=dt*1.2;
    fragment.halo.scale.setScalar(1+.11*Math.sin(now*.004+i));
    if(Math.hypot(hero.position.x-fragment.x,hero.position.z-fragment.z)>1.06) continue;
    fragment.found=true;
    fragment.crystal.visible=fragment.halo.visible=false;
    fragmentCount++;
    showGravityLamps();
    cue('crystal');
    toast(`找到星屑 · ${['第一个','第二个','第三个'][i]}符号是 ${runeSymbols[runeOrder[i]]}`);
  }
  const plateIndex=plates.findIndex(p=>Math.abs(p.x-hero.position.x)<1.10&&
    Math.abs(p.z-hero.position.z)<1.10);
  for(const [index,plate] of plates.entries()){
    plate.group.position.y+=((plateIndex===index?.085:.20)-plate.group.position.y)*Math.min(1,dt*15);
  }
  if(plateIndex>=0&&plateIndex!==lastPlate&&!gravityOpen){
    cue('plate');
    if(fragmentCount<fragments.length){
      toast('先沿星光找齐三枚星屑。');
    }else if(plateIndex===runeOrder[runeStep]){
      runeStep++;
      gravityOpen=runeStep===runeOrder.length;
      if(gravityOpen){
        rescueMark.visible=true;
        toast('三枚星纹连成一线，石门开启！');
        cue('door');
      }
    }else{
      runeStep=plateIndex===runeOrder[0]?1:0;
      toast('灯序重新开始，星屑仍在。');
    }
    showGravityLamps();
  }
  lastPlate=plateIndex;
  for(const [index,entry] of lamps.entries()){
    entry.gem.rotation.y+=dt*.54;
    entry.ring.rotation.y+=dt*.92;
    if(runeOrder.indexOf(index)<runeStep) entry.lamp.intensity=6+Math.sin(now*.004+index)*1.05;
  }
  if(!gravityOpen) return;
  gravityGate.position.y=Math.min(4.4,gravityGate.position.y+dt*2.7);
  if(gravityGate.position.y>3.8&&hero.position.z<starGateZ+.58&&Math.abs(hero.position.x)<1.15){
    completeLevel(stage);
  }
}

function paintAudioButtons(){

function enableAudio(){
  if(audioActivation) return audioActivation;
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context) return null;
  try{
    if(!audio){
      audio=new Context();
      musicGain=audio.createGain();
      fxGain=audio.createGain();
      musicGain.connect(audio.destination);
      fxGain.connect(audio.destination);
      const length=Math.floor(audio.sampleRate*.32);
      noiseBuffer=audio.createBuffer(1,length,audio.sampleRate);
      const data=noiseBuffer.getChannelData(0);
      let rough=0;
      for(let i=0;i<length;i++){
        rough=rough*.72+(Math.random()*2-1)*.28;
        data[i]=rough;
      }
      setAudioGains();
    }
    if(audio.state==='running') return null;
    audioActivation=audio.resume().catch(()=>{}).finally(()=>{audioActivation=null});
    return audioActivation;
  }catch{return null}
}
function setAudioGains(){
  if(!audio||!musicGain||!fxGain) return;
  musicGain.gain.setTargetAtTime(musicOn?.22:0,audio.currentTime,.035);
  fxGain.gain.setTargetAtTime(fxOn?.49:0,audio.currentTime,.018);
}
function storeAudioPreference(key,enabled){
  try{localStorage.setItem(key,enabled?'on':'off')}catch{}
  paintAudioButtons();
  setAudioGains();
}

function tone(bus,at,freq,duration,volume,wave='sine',endFreq=freq){
  const oscillator=audio.createOscillator(), gain=audio.createGain();
  oscillator.type=wave;
  oscillator.frequency.setValueAtTime(freq,at);
  oscillator.frequency.exponentialRampToValueAtTime(endFreq,at+duration);
  gain.gain.setValueAtTime(.0001,at);
  gain.gain.exponentialRampToValueAtTime(volume,at+Math.min(.035,duration*.25));
  gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
  oscillator.connect(gain);
  gain.connect(bus);
  oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()};
  oscillator.start(at);
  oscillator.stop(at+duration+.012);
}
function grit(at,duration,amount,frequency){
  const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();
  source.buffer=noiseBuffer;
  source.loop=true;
  filter.type='lowpass';
  filter.frequency.setValueAtTime(frequency,at);
  filter.frequency.exponentialRampToValueAtTime(frequency*.36,at+duration);
  gain.gain.setValueAtTime(amount,at);
  gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
  source.connect(filter);
  filter.connect(gain);
  gain.connect(fxGain);
  source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect()};
  source.start(at);
  source.stop(at+duration+.01);
}
const cueIntervals={push:.22,mirror:.13,impact:.22,plate:.23,crystal:.6,door:.72,'depth-gear':.48,'depth-chime':.4,'depth-fall':.5,'depth-roar':.35};
function cue(name){
  if(!audio||audio.state!=='running'||!fxOn) return;
  const at=audio.currentTime+.012;
  if(at-(effectsLast.get(name)??-Infinity)<cueIntervals[name]) return;
  effectsLast.set(name,at);
  if(name==='push') grit(at,.19,.32,560);
  if(name==='mirror'){
    grit(at,.055,.26,1760);
    tone(fxGain,at,390,.078,.085,'triangle',243);
  }
  if(name==='impact'){
    tone(fxGain,at,139,.19,.17,'sine',72);
    grit(at,.105,.22,1130);
  }
  if(name==='plate'){
    tone(fxGain,at,104,.19,.26,'triangle',48);
    grit(at,.14,.42,970);
    tone(fxGain,at+.075,570,.19,.1,'sine');
  }
  if(name==='crystal'){
    [523.25,659.25,783.99,1046.5].forEach((hz,index)=>{
      tone(fxGain,at+index*.115,hz,.56,.14,'sine');
    });
  }
  if(name==='depth-gear'){
    grit(at,.40,.18,430);
    tone(fxGain,at,122,.34,.17,'triangle',72);
  }
  if(name==='depth-chime'){
    [523,784,1175].forEach((hz,i)=>tone(fxGain,at+i*.09,hz,.53,.11,'sine'));
  }
  if(name==='depth-fall') tone(fxGain,at,205,.44,.17,'sine',56);
  if(name==='depth-roar'){
    grit(at,.24,.13,340);
    tone(fxGain,at,81,.21,.15,'triangle',52);
  }
  if(name==='door'){
    grit(at,.69,.29,570);
    tone(fxGain,at,72,.63,.14,'triangle',43);
  }
}
const explorePhrases=[[45,52,57,59],[41,48,53,57],[48,55,60,62],[43,50,55,57]];
const rescuePhrase=[60,64,67,72,71,67,64,69,67,64,62,60];
function frequency(note){return 440*Math.pow(2,(note-69)/12)}
function updateMusic(){
  if(!audio||audio.state!=='running') return;
  const now=audio.currentTime;
  const mode=stage===10&&finished?'rescue':stage;
  if(mode!==previousNoteMode){
    previousNoteMode=mode;
    nextNote=now+.025;
    musicStep=0;
  }
  if(!musicOn) return;
  if(nextNote<now-.18) nextNote=now+.02;
  while(nextNote<now+.16){
    if(mode==='rescue'){
      if(musicStep>=rescuePhrase.length) return;
      const note=rescuePhrase[musicStep];
      tone(musicGain,nextNote,frequency(note),.72,.28,'sine');
      if(musicStep%3===0) tone(musicGain,nextNote,frequency(note-12),1.1,.17,'sine');
      nextNote+=.43;
    }else if(mode===2){
      const line=[74,81,86,78,76,83,88,79,74,81,85,78,71,78,83,76];
      const hz=frequency(line[musicStep%16]);tone(musicGain,nextNote,hz,.86,.14,'sine');
      tone(musicGain,nextNote+.04,hz*2,.34,.044,'triangle');
      if(musicStep%8===0)tone(musicGain,nextNote,hz/4,1.65,.17,'sine');
      nextNote+=.32;
    }else if(mode===3){
      const notes=[50,0,57,62,0,55,0,60,48,0,55,60,0,53,58,0];
      const n=notes[musicStep%16];if(n)tone(musicGain,nextNote,frequency(n),.29,.22,'triangle');
      if(musicStep%4===0)tone(musicGain,nextNote,84,.2,.20,'sine',42);
      nextNote+=.39;
    }else if(mode===4){
      const bass=[38,38,45,41,38,46,43,36];const n=bass[musicStep%8];
      tone(musicGain,nextNote,frequency(n),.19,.22,'triangle');
      if(musicStep%4!==1)tone(musicGain,nextNote,100,.16,.24,'sine',39);
      if(musicStep%4===3)tone(musicGain,nextNote+.1,frequency(n+19),.25,.13,'triangle');
      nextNote+=.258;
    }else if(mode>=5&&mode<=7){
      const note=[[43,50,55,46,50,58],[62,69,74,71,67,76],[36,43,38,46,41,48]][mode-5][musicStep%6];
      const hz=frequency(note);
      tone(musicGain,nextNote,hz,mode===6?.68:.32,.16,mode===6?'sine':'triangle');
      if(musicStep%3===0) tone(musicGain,nextNote,hz/2,.63,.13,'sine');
      nextNote+=mode===6?.44:mode===5?.34:.29;
    }else{
      const pattern=[0,2,1,3,2,1,3,1];
      const chord=explorePhrases[Math.floor(musicStep/8)%explorePhrases.length];
      const note=chord[pattern[musicStep%8]];
      tone(musicGain,nextNote,frequency(note),1.23,.22,'sine');
      if(musicStep%4===0) tone(musicGain,nextNote,frequency(chord[0]-12),2.1,.17,'sine');
      nextNote+=.49;
    }
    musicStep++;
  }
}

function circleHitsCrate(x,z,cx,cz) {
  const dx=Math.max(0,Math.abs(x-cx)-crateHalf);
  const dz=Math.max(0,Math.abs(z-cz)-crateHalf);
  return dx*dx+dz*dz < heroRadius*heroRadius-1e-7;
}

function heroHitsPillar(x,z) {
  const dx=Math.max(0,Math.abs(x-pillarX)-pillarHalfX);
  const dz=Math.max(0,Math.abs(z-pillarZ)-pillarHalfZ);
  return dx*dx+dz*dz < heroRadius*heroRadius-1e-7;
}

function crateCanOccupy(index,x,z,hx,hz) {
  // Leave a lane around the arena edge so a player can push a crate back out.
  const clearance = crateHalf + heroRadius + .12;
  if (Math.abs(x) > wallLimits.x-clearance ||
      z < wallLimits.zMin+clearance || z > wallLimits.zMax-clearance) return false;
  if (circleHitsCrate(hx,hz,x,z)) return false;
  if (Math.abs(x-pillarX)<pillarHalfX+crateHalf-1e-6 &&
      Math.abs(z-pillarZ)<pillarHalfZ+crateHalf-1e-6) return false;
  return !crates.some((other,i)=>i!==index &&
    Math.abs(x-other.position.x)<crateHalf*2-1e-6 &&
    Math.abs(z-other.position.z)<crateHalf*2-1e-6);
}

function lockCrateIfAligned(index,hx,hz) {
  const c=crates[index], pad=pads[index];
  if (solved[index] || Math.hypot(c.position.x-pad.x,c.position.z-pad.z)>.36 ||
      !crateCanOccupy(index,pad.x,pad.z,hx,hz)) return;
  c.position.set(pad.x,0,pad.z);
  solved[index]=true;
  rings[index].geometry.dispose();
  rings[index].geometry=new THREE.TorusGeometry(.78,.084,7,32);
  const count=solved.filter(Boolean).length;
  progress.textContent=`能量机关：${count} / 3`;
  if (count===3) {
    doorOpen=true;
    cue('door');
    tip.textContent='大门已打开！进入石拱门，完成第一关。';
    toast('三道能量锁解除！大门开启！');
  } else {
    toast('能量机关已激活！');
    cue('plate');
  }
}

function displaceCrate(index,dx,dz,hx,hz) {
  const c=crates[index];
  if (solved[index] || !crateCanOccupy(index,c.position.x+dx,c.position.z+dz,hx,hz)) return false;
  c.position.x+=dx;
  c.position.z+=dz;
  lockCrateIfAligned(index,hx,hz);
  return true;
}

// Small swept steps prevent tunneling even when a frame or skill moves far.
function shoveCrate(index,dx,dz) {
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.10));
  let moved=false;
  for(let i=0;i<steps;i++){
    if(!displaceCrate(index,dx/steps,dz/steps,hero.position.x,hero.position.z)) break;
    moved=true;
  }
  return moved;
}

function moveHeroStep(dx,dz, canPush=true) {
  const pos=hero.position;
  const x=THREE.MathUtils.clamp(pos.x+dx,-wallLimits.x,wallLimits.x);
  const z=THREE.MathUtils.clamp(pos.z+dz,wallLimits.zMin,wallLimits.zMax);
  dx=x-pos.x; dz=z-pos.z;
  if (Math.hypot(dx,dz)<1e-6 || heroHitsPillar(x,z)) return 0;
  const hits=[];
  for(let i=0;i<crates.length;i++){
    const c=crates[i].position;
    if(circleHitsCrate(x,z,c.x,c.z)) hits.push(i);
  }
  if(hits.length) {
    if(!canPush || hits.length!==1) return 0;
    const index=hits[0];
    const boxPos=crates[index].position;
    // Grazing a side slides along the box. Only input into the contact pushes it.
    const nx=boxPos.x-THREE.MathUtils.clamp(boxPos.x,pos.x-crateHalf,pos.x+crateHalf);
    const nz=boxPos.z-THREE.MathUtils.clamp(boxPos.z,pos.z-crateHalf,pos.z+crateHalf);
    if(dx*nx+dz*nz<=1e-7 || !displaceCrate(index,dx,dz,x,z)) return 0;
    pos.set(x,0,z);
    return 2;
  }
  pos.set(x,0,z);
  return 1;
}

function moveHero(dx,dz) {
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.085));
  let movement=0;
  for(let i=0;i<steps;i++){
    const x=dx/steps,z=dz/steps;
    const step=moveHeroStep(x,z);
    if(step){movement=Math.max(movement,step);continue}
    // Slide along a blocking crate without changing the direction it was being pushed.
    movement=Math.max(movement,moveHeroStep(x,0,false),moveHeroStep(0,z,false));
  }
  return movement;
}

function visual(geometry, color, opacity = 1, additive = true) {
  return new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
    color, opacity, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    toneMapped: false
  }));
}

function animateEffect(group, start, duration, update) {
  scene.add(group);
  effects.push({group, start, duration, update});
}

function updateEffects(now) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const entry = effects[i];
    const age = (now - entry.start) / entry.duration;
    if (age < 1) {
      entry.update(Math.max(age, 0));
      continue;
    }
    scene.remove(entry.group);
    entry.group.traverse(object => {
      if (!object.isMesh) return;
      object.geometry.dispose();
      object.material.dispose();
    });
    effects.splice(i, 1);
  }
}

function slamEffect(now) {

      chip.rotation.set(impact * 7 + i, impact * 5, i);
      chip.material.opacity = impact > 0 ? 1 - impact : 0;
    });
  });
}

function haptic(pattern){
  const canvas=renderer.domElement;
  if(canvas.animate && !window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){
    const shift=Array.isArray(pattern)?3:1;
    const animation=canvas.animate([{transform:'translateX(0)'},{transform:'translateX('+shift+'px)'},{transform:'translateX(-'+shift+'px)'},{transform:'translateX(0)'}],{duration:140});
    shakeAnimations.add(animation);
    animation.onfinish=animation.oncancel=()=>shakeAnimations.delete(animation);
  }
  if(typeof navigator!=='undefined' && typeof navigator.vibrate==='function') navigator.vibrate(pattern);
}

  for(const guard of guards){
    guard.hp=3;
    guard.mode='idle';
    guard.until=now+guard.delay;
    guard.spent=false;
    guard.knockback=null;
    guard.vx=guard.vz=0;
    guard.body.position.set(guard.x,0,guard.z);
    guard.body.rotation.y=0;
    guard.body.visible=true;
    guard.warning.visible=false;
    guard.jewel.material=dormantCore;
    for(const pip of guard.pips) pip.visible=true;
  }
  showGuardStatus();
  tip.textContent='面向守卫放暗焰。看到橙色冲撞预警就侧移或开石甲，靠近可用震地。';
}

function moveInGuardRoom(dx,dz){
  const p=hero.position;
  const x=THREE.MathUtils.clamp(p.x+dx,-arena.x,arena.x);
  let z=THREE.MathUtils.clamp(p.z+dz,arena.minZ,arena.maxZ);
  const threshold=arena.gateZ+1.72;
  if(z<threshold&&(!guardOpen||firstSeal.position.y<4||Math.abs(x)>1.16)) z=threshold;
  const canMove=(toX,toZ)=>guards.every(guard=>{
    if(!guard.hp) return true;
    const other=guard.body.position;
    const before=Math.hypot(p.x-other.x,p.z-other.z);
    const after=Math.hypot(toX-other.x,toZ-other.z);
    // An existing overlap must allow movement that makes it shallower.
    return after>=Math.min(before,playerGuardSeparation)-1e-6;
  });
  const oldX=p.x,oldZ=p.z;
  if(canMove(x,z)) p.set(x,0,z);
  else{
    if(canMove(x,p.z)) p.x=x;
    if(canMove(p.x,z)) p.z=z;
  }
  return Math.hypot(p.x-oldX,p.z-oldZ)>1e-5?1:0;
}

function moveGuard(guard,dx,dz){
  const p=guard.body.position;
  const x=THREE.MathUtils.clamp(p.x+dx,-guardBounds.x,guardBounds.x);
  const z=THREE.MathUtils.clamp(p.z+dz,guardBounds.minZ,guardBounds.maxZ);
  const tryMove=(toX,toZ)=>{
    const hx=p.x-hero.position.x,hz=p.z-hero.position.z;
    const startSq=hx*hx+hz*hz;
    const radiusSq=playerGuardSeparation**2;
    const stepX=toX-p.x,stepZ=toZ-p.z;
    const stepSq=stepX*stepX+stepZ*stepZ;
    if(stepSq<1e-12) return true;
    const projection=hx*stepX+hz*stepZ;
    if(startSq<radiusSq-1e-6){
      // If already overlapping, let the guard move out without sinking deeper.
      if(startSq+2*projection+stepSq<startSq-1e-6) return false;
    }else if(projection<0){
      // Stop at player contact, still within the charge's 1.30-unit hit radius.
      const hit=projection*projection-stepSq*Math.max(0,startSq-radiusSq);
      if(hit>0){
        const fraction=Math.min(1,(-projection-Math.sqrt(hit))/stepSq);
        if(fraction<=0) return false;
        toX=p.x+stepX*fraction;
        toZ=p.z+stepZ*fraction;
      }
    }
    if(Math.abs(toX)>guardPillarClearance&&guardPillarRows.some(row=>Math.abs(toZ-row)<1.81)) return false;
    for(const other of guards){
      if(other===guard||!other.hp) continue;
      const q=other.body.position;
      const before=Math.hypot(p.x-q.x,p.z-q.z);
      if(Math.hypot(toX-q.x,toZ-q.z)<Math.min(before,guardSeparation)-1e-6) return false;
    }
    p.set(toX,0,toZ);
    return true;
  };
  if(!tryMove(x,z)){
    tryMove(x,p.z);
    tryMove(p.x,z);
  }
}

function separateGuards(){
  const [first,second]=guards;
  if(!first.hp||!second.hp) return;
  const a=first.body.position,b=second.body.position;
  const x=b.x-a.x,z=b.z-a.z;
  const distance=Math.hypot(x,z);
  if(distance>=guardSeparation) return;
  const shift=(guardSeparation-distance)/2;
  const dx=distance>1e-6?x/distance*shift:shift;
  const dz=distance>1e-6?z/distance*shift:0;
  moveGuard(first,-dx,-dz);
  moveGuard(second,dx,dz);
}

function knockGuardBack(guard,index){
  if(!guard.hp) return;
  const p=guard.body.position;
  let dx=p.x-hero.position.x,dz=p.z-hero.position.z;
  const length=Math.hypot(dx,dz);
  if(length<1e-4){
    const side=index===0?-1:1;
    dx=side*Math.cos(hero.rotation.y);
    dz=-side*Math.sin(hero.rotation.y);
  }else{
    dx/=length;dz/=length;
  }
  guard.knockback={dx,dz,elapsed:0};
}

function updateGuardKnockback(guard,dt){
  const motion=guard.knockback;
  if(!motion) return;
  const remaining=1-motion.elapsed/knockbackDuration;
  motion.elapsed=Math.min(knockbackDuration,motion.elapsed+dt);
  const nextRemaining=1-motion.elapsed/knockbackDuration;
  const distance=knockbackDistance*(remaining**3-nextRemaining**3);
  // Substeps keep even the fastest part of the impulse inside collision bounds.
  const steps=Math.max(1,Math.ceil(distance/.12));
  for(let i=0;i<steps;i++) moveGuard(guard,motion.dx*distance/steps,motion.dz*distance/steps);
  if(motion.elapsed===knockbackDuration){
    guard.knockback=null;
  }
}

function hitGuard(guard,damage,now,stun){
  if(!guard.hp) return;
  guard.hp=Math.max(0,guard.hp-damage);
  guard.mode='stun';
  guard.until=now+stun;
  guard.warning.visible=false;
  for(const [index,pip] of guard.pips.entries()) pip.visible=index<guard.hp;
  guard.body.visible=guard.hp>0;
  if(!guard.hp){
    guard.knockback=null;
    cue('crystal');
  }
  showGuardStatus();
  if(guards.every(g=>!g.hp)){
    guardOpen=true;
    guardExit.visible=true;
    firstSeal.position.y=Math.max(firstSeal.position.y,1.48);
    tip.textContent='守卫已击退。走到石门前，查看第四关结算。';
    cue('door');
    toast('守卫熄火，石门开启！');
  }
}

function useGuardSkill(type,now){
  if(type==='shield'){
    
    wardEffect(now);
    toast('岩甲环绕 · 五秒内可格挡三次');
    return;
  }
  if(type==='slam'){
    slamEffect(now);
    let hit=0;
    for(const [index,guard] of guards.entries()){
      if(guard.hp&&hero.position.distanceTo(guard.body.position)<3.75){
        hitGuard(guard,1,now,1800);
        knockGuardBack(guard,index);
        hit++;
      }
    }
    if(!guardOpen) toast(hit?'守卫被震晕！':'靠近守卫再用震地。');
    return;
  }
  flameEffect(now);
  const forwardX=-Math.sin(hero.rotation.y);
  const forwardZ=-Math.cos(hero.rotation.y);
  let target=null,closest=7.15;
  for(const guard of guards){
    if(!guard.hp) continue;
    const x=guard.body.position.x-hero.position.x;
    const z=guard.body.position.z-hero.position.z;
    const ahead=x*forwardX+z*forwardZ;
    if(ahead>.23&&ahead<closest&&Math.abs(x*forwardZ-z*forwardX)<1.10){
      target=guard;
      closest=ahead;
    }
  }
  if(target) hitGuard(target,1,now,530);
  if(!guardOpen) toast(target?'暗焰命中守卫！':'转向守卫，再放暗焰。');
}

function updateGuardRoom(dt,now){
  separateGuards();
  for(const guard of guards){
    if(!guard.hp) continue;
    updateGuardKnockback(guard,dt);
    const p=guard.body.position;
    const dx=hero.position.x-p.x,dz=hero.position.z-p.z;
    const distance=Math.hypot(dx,dz);
    guard.orb.position.y=.08+Math.sin(now*.004+p.x)*.08;
    if(guard.mode==='windup'){
      guard.warning.position.copy(p);
      guard.warnMaterial.opacity=.25+Math.sin(now*.015)*.115;
      if(now>=guard.until){
        guard.mode='charge';
        guard.until=now+550;
        guard.spent=false;
        guard.warning.visible=false;
      }
    }else if(guard.mode==='charge'){
      moveGuard(guard,guard.vx*8.6*dt,guard.vz*8.6*dt);
      if(!guard.spent&&Math.hypot(hero.position.x-p.x,hero.position.z-p.z)<1.30){
        guard.spent=true;
        if(now<shieldUntil && wardCharges>0){
          if(--wardCharges===0) shieldUntil=0;
          haptic([20,30,35]);
          hitGuard(guard,1,now,1450);
          cue('impact');
          if(!guardOpen) toast('石甲挡住冲撞，守卫受到反震！');
        }else if(now>=hitGrace){
          heroHp--;refreshHealth();haptic([65,35,65]);
          hitGrace=now+1000;
          cue('impact');
          showGuardStatus();
          if(!heroHp){
            failLevel(stage);
            return;
          }
        }
      }
      if(guard.mode==='charge'&&now>=guard.until){
        guard.mode='idle';
        guard.until=now+1250;
      }
    }else if(guard.mode==='stun'){
      if(now>=guard.until){
        guard.mode='idle';
        guard.until=now+700;
      }
    }else if(distance>.001){
      guard.body.rotation.y=Math.atan2(dx,dz);
      if(distance>3.8){
        moveGuard(guard,dx/distance*dt*1.48,dz/distance*dt*1.48);
      }else if(now>=guard.until){
        guard.vx=dx/distance;
        guard.vz=dz/distance;
        guard.mode='windup';
        guard.until=now+780;
        guard.warning.position.set(p.x,0,p.z);
        guard.warning.rotation.y=guard.body.rotation.y;
        guard.warning.visible=true;
      }
    }
    guard.jewel.material=guard.mode==='stun'?stunGlow:
      guard.mode==='windup'||guard.mode==='charge'?hostileGlow:dormantCore;
  }
  if(guardOpen){
    firstSeal.position.y=Math.min(4.6,firstSeal.position.y+dt*2.85);
    if(firstSeal.position.y>=4&&hero.position.z<arena.gateZ+1.03&&Math.abs(hero.position.x)<1.16){
      completeLevel(stage);
    }
  }
}

function useSkill(type){
 if(afterStory) return;
 const now=performance.now();if((stage!==1&&stage!==4&&stage!==7)||finished){toast('此处无法施放技能');return}

 if(type==='slam'){

for(const type of ['flame','shield','slam'])document.getElementById(type+'Skill').addEventListener('click',()=>useSkill(type));

const levels={
  1:{enter:enterRuins,exit:resetRuins,updateDuringStory:true,move:moveHero,speed:3.85,update:updateRuins,chapter:0,next:2},

     chapter:2,next:4,chapterNote:()=>` 这段路上找到 ${fragmentCount} / 3 枚星屑。`},
  4:{enter:enterGuardRoom,room:guardRoom,move:moveInGuardRoom,speed:5.15,update:updateGuardRoom,chapter:4,next:5,
     victory:['第四关通过','守卫已退，驿风仍在遗迹深处。','再战守卫','前往机械深渊'],
     failure:['守卫暂时占了上风','留意橙色预警，侧移避开，或者用石甲挡住冲撞。','重试第四关']},
  5:{enter:enterMechanicalRoom,exit:releaseDepthRoom,move:moveMechanical,speed:4.6,update:updateMechanicalRoom,chapter:5,next:6,
     failure:['落入机械深渊','等桥板停止移动，再沿亮着金边的桥板前进。','重试第五关']},
  6:{enter:enterCrystalRoom,exit:releaseDepthRoom,move:moveCrystal,speed:4.4,update:updateCrystalRoom,chapter:6,next:7,
     failure:['幻路塌落了','青光刻痕标记坚实石路。橙色波纹下是空的。','重试第六关']},
  7:{enter:enterNestRoom,exit:releaseDepthRoom,move:moveNest,speed:5.15,update:updateNestRoom,chapter:7,
     victory:['第七关通过','你已穿过深渊兽巢。第八关待续，驿风在遗迹深处等你。','再战兽巢'],
     failure:['兽巢的守卫挡住了去路','躲开直线冲撞和圆形震波。用石甲护身，也可以用震地打断蓄力。','重试第七关']}
};

function requestedLevel(){
  const url=new URL(location.href);
  const localLevel=url.protocol==='file:'&&/^#level=\d+$/.test(url.hash)&&url.hash.slice(7);
  const value=localLevel||url.searchParams.get('level');
  return Object.hasOwn(levels,value)?Number(value):1;
}

function syncLevelUrl(level){
  const url=new URL(location.href);
  if(requestedLevel()===level) return;
  if(url.protocol==='file:'){
    // Local files can change their fragment without navigating away from the game.
    url.hash='level='+level;
  }else{
    url.searchParams.set('level',level);
  }
  history.replaceState(history.state,'',url.href);
}

function resetInput(){
  if(joyId!==null&&joy.hasPointerCapture(joyId)) joy.releasePointerCapture(joyId);
  for(const id of orbitPointers.keys()){
    if(viewSurface.hasPointerCapture(id)) viewSurface.releasePointerCapture(id);
  }
  endJoy();
  orbitPointers.clear();
  for(const key of Object.keys(keys)) keys[key]=false;
}

function exitLevel(level){
  const previous=levels[level];
  if(previous?.room) previous.room.visible=false;
  previous?.exit?.();
  resetInput();
  clearTimeout(toastTimer);
  notice.style.display='none';
  afterStory=null;
  story.hidden=encounter.hidden=depthAction.hidden=true;
  turnMirror.hidden=orbitTools.hidden=pairPicker.hidden=inspect.hidden=true;
  aimMarker.visible=false;
  skills.style.display='none';
  if(document.activeElement!==document.body) document.activeElement?.blur();
  updateEffects(Infinity);
  for(const animation of shakeAnimations) animation.cancel();
  shakeAnimations.clear();
  shieldUntil=wardCharges=0;
  for(const type of Object.keys(cd)) cd[type]=0;
  mixer?.stopAllAction();
  oneShot=activeAction=null;
}

function enterLevel(level){
  if(!Number.isInteger(level)||!Object.hasOwn(levels,level)){
    console.debug('Ignored unregistered level:',level);
    return;
  }
  const restarting=stage===level;
  exitLevel(stage);
  stage=level;
  finished=false;
  inspectSide=false;
  inspect.textContent='看角色';
  inspect.setAttribute('aria-pressed','false');
  hero.rotation.y=0;
  if(level!==4&&level!==7&&heroHp!==hpMax){heroHp=hpMax;refreshHealth();}
  levels[level].enter(restarting);
  resetOrbit();
  orbitTools.hidden=false;
  updateCamera();
  playMotion('Idle');
  syncLevelUrl(level);
}

function restartCurrentLevel(){
  enterLevel(stage);
}

function completeLevel(level){
  if(level!==stage||finished) return;
  const {chapter,next,chapterNote,victory}=levels[level];
  finished=true;
  if(victory){
    resetInput();
    if(chapter!==undefined&&next===undefined)playChapter(chapter,()=>guardPanel(...victory));
    else guardPanel(...victory);
  }else{
    playChapter(chapter,()=>enterLevel(next));
    if(chapterNote) storyText.textContent+=chapterNote();
  }
}

function failLevel(level){
  const failure=levels[level]?.failure;
  if(level!==stage||finished||!failure) return;
  finished=true;
  resetInput();
  guardPanel(...failure);
}

const orbitLook=new THREE.Vector3();
function updateCamera(){
  const view=cameraViews[stage];
  const player=hero.position;
  if(view.center){
    const closeup=THREE.MathUtils.clamp((view.distance-.5-orbitDistance)/(view.distance-.5-view.min),0,.88);
    orbitLook.copy(view.center).lerp(player,closeup);
    orbitLook.y=THREE.MathUtils.lerp(view.center.y,view.focusHeight??1.15,closeup);
  }else{
    orbitLook.set(player.x,inspectSide?1.82:view.height,player.z);
  }
  const planar=Math.cos(orbitPitch)*orbitDistance;
  camera.position.set(orbitLook.x+Math.sin(orbitYaw)*planar,
    orbitLook.y+Math.sin(orbitPitch)*orbitDistance,orbitLook.z+Math.cos(orbitYaw)*planar);
  camera.lookAt(orbitLook);
}
let clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let now=performance.now();updateEffects(now);updateMusic();
status.textContent=now<shieldUntil?'石甲 · 剩余 '+wardCharges+' 次 · '+Math.ceil((shieldUntil-now)/1000)+' 秒':'';
for(const type of ['flame','shield','slam']){let b=document.getElementById(type+'Skill');let remain=Math.ceil((cd[type]-now)/1000);b.disabled=remain>0;b.style.filter=remain>0?'grayscale(.6)':'none';}
let dt=Math.min(clock.getDelta(),.05);let x=dx+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),z=dy+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let l=Math.hypot(x,z);if(l>.1&&!finished&&!afterStory){x/=Math.max(l,1);z/=Math.max(l,1);
 const cos=Math.cos(orbitYaw),sin=Math.sin(orbitYaw);
 [x,z]=[x*cos+z*sin,-x*sin+z*cos];
 hero.rotation.y=Math.atan2(-x,-z);
 const {move,speed}=levels[stage];
 const movement=move(x*speed*dt,z*speed*dt);
 if(movement===2) cue('push');
 playMotion(movement===2?'Push':movement===1?'Walk':'Idle');
}else{playMotion('Idle')}
if(mixer)mixer.update(dt);
const level=levels[stage];
if(!finished||(afterStory&&level.updateDuringStory)) level.update(dt,now);
updateCamera();
renderer.render(scene,camera)}
function startGame(){
  const url=new URL(location.href);
  const value=url.searchParams.get('level');
  if(value!==null&&!Object.hasOwn(levels,value)){
    url.searchParams.delete('level');
    if(url.protocol==='file:'){
      // File history entries only allow fragment edits without navigation.
      location.replace(url.href);
      return;
    }
    history.replaceState(history.state,'',url.href);
  }
  enterLevel(requestedLevel());
  animate();
}
startGame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(stage!==null) updateCamera()})
